name: maven-publish.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and quality tests
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
      SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY || vars.SONAR_ORG_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        run: mvn -B clean test

      - name: Functional tests
        id: functional-tests
        continue-on-error: true
        run: mvn -B verify -Pfunctional-tests -DskipUnitTests

      - name: Performance tests
        id: performance-tests
        continue-on-error: true
        run: mvn -B verify -Pperformance-tests -DskipUnitTests

      - name: Code coverage
        id: coverage-check
        continue-on-error: true
        run: mvn -B jacoco:report@coverage-report jacoco:check@coverage-check

      - name: Publish unit test results to ServiceNow
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          xml-report-filename: target/unit-test-reports/
          test-summary-name: SprintRunner unit tests

      - name: Publish functional test results to ServiceNow
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          xml-report-filename: target/functional-test-reports/
          test-summary-name: SprintRunner smoke tests

      - name: Publish performance test results to ServiceNow
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          xml-report-filename: target/performance-test-reports/
          test-summary-name: SprintRunner load tests

      - name: Publish software quality results to ServiceNow
        if: ${{ always() && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: ServiceNow/servicenow-devops-sonar@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          sonar-host-url: ${{ env.SONAR_HOST_URL }}
          sonar-project-key: ${{ env.SONAR_PROJECT_KEY }}
          sonar-org-key: ${{ env.SONAR_ORG_KEY }}

      - name: Explain unavailable software quality publishing
        if: ${{ always() && (env.SONAR_HOST_URL == '' || env.SONAR_PROJECT_KEY == '') }}
        run: |
          echo "::warning::DPR quality widgets require an onboarded SonarQube/SonarCloud tool plus SONAR_HOST_URL and SONAR_PROJECT_KEY repository variables. Test and JaCoCo reports are still available as workflow artifacts."

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results-${{ github.run_id }}
          path: |
            target/unit-test-reports/
            target/functional-test-reports/
            target/performance-test-reports/
            target/site/jacoco/

      - name: Fail job if any test or coverage step failed
        if: always()
        env:
          UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          FUNCTIONAL_TESTS: ${{ steps.functional-tests.outcome }}
          PERFORMANCE_TESTS: ${{ steps.performance-tests.outcome }}
          CODE_COVERAGE: ${{ steps.coverage-check.outcome }}
        run: |
          failed=""
          for step in UNIT_TESTS FUNCTIONAL_TESTS PERFORMANCE_TESTS CODE_COVERAGE; do
            outcome="${!step}"
            if [ "$outcome" != "success" ]; then
              failed="$failed $step ($outcome)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed. Results were published to ServiceNow before failing."
            exit 1
          fi

  create-change:
    name: ServiceNow DevOps Change Automation (demo)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Simulate change request
        run: echo "Demo change request CHG-DEMO-${{ github.run_number }} approved"

  publish-package:
    name: Publish package (demo)
    runs-on: ubuntu-latest
    needs: create-change
    steps:
      - name: Simulate package publication
        run: echo "Demo package publication completed; no package was published"
