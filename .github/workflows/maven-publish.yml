name: Maven Package

on:
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Initialize build
        run: echo "Initializing demo Maven package build"
      - name: Build package
        run: echo "Demo Maven package built successfully"

  create-change:
    name: ServiceNow DevOps Change Automation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Create change request
        run: echo "Demo change request created successfully"
      - name: Approve change request
        run: echo "Demo change request approved successfully"

  publish-package:
    name: Publish package
    runs-on: ubuntu-latest
    needs: create-change
    steps:
      - name: Prepare package
        run: echo "Demo package prepared for publishing"
      - name: Publish package
        run: echo "Demo package published successfully"
