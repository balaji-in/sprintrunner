name: sprintrunner-quality.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and quality tests
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
      SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY || vars.SONAR_ORG_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit tests
        run: mvn -B clean test

      - name: Functional tests
        run: mvn -B verify -Pfunctional-tests -DskipUnitTests

      - name: Performance tests
        run: mvn -B verify -Pperformance-tests -DskipUnitTests

      - name: Code coverage
        run: mvn -B jacoco:report@coverage-report jacoco:check@coverage-check

      - name: Generate reports from Maven test output
        env:
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_STAGE_NAME: Build and quality tests
        run: python3 scripts/generate-quality-reports.py

      - name: Publish unit test results to ServiceNow
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          xml-report-filename: target/quality-reports/servicenow-unit-tests.xml
          test-summary-name: SprintRunner unit tests

      - name: Publish functional test results to ServiceNow
        env:
          SN_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: sn_devops.DevOpsToken ${SN_ORCHESTRATION_TOOL_ID}:${SN_DEVOPS_INTEGRATION_TOKEN}" \
            --data-binary @target/quality-reports/servicenow-functional-tests.json \
            "${SN_INSTANCE_URL%/}/api/sn_devops/v2/devops/tool/test?toolId=${SN_ORCHESTRATION_TOOL_ID}&orchestrationToolId=${SN_ORCHESTRATION_TOOL_ID}&testType=Smoke"

      - name: Publish performance test results to ServiceNow
        env:
          SN_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: sn_devops.DevOpsToken ${SN_ORCHESTRATION_TOOL_ID}:${SN_DEVOPS_INTEGRATION_TOKEN}" \
            --data-binary @target/quality-reports/servicenow-performance-tests.json \
            "${SN_INSTANCE_URL%/}/api/sn_devops/v2/devops/tool/test?toolId=${SN_ORCHESTRATION_TOOL_ID}&orchestrationToolId=${SN_ORCHESTRATION_TOOL_ID}&testType=Load"

      # DPR quality widgets only read Software Quality Scan Summary/Detail records.
      # This official action creates those records and relates them to this job.
      # SONAR_HOST_URL and SONAR_PROJECT_KEY are repository variables; the Sonar
      # tool with that URL must also be onboarded in ServiceNow DevOps.
      - name: Publish software quality results to ServiceNow
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: ServiceNow/servicenow-devops-sonar@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          sonar-host-url: ${{ env.SONAR_HOST_URL }}
          sonar-project-key: ${{ env.SONAR_PROJECT_KEY }}
          sonar-org-key: ${{ env.SONAR_ORG_KEY }}

      - name: Explain unavailable software quality publishing
        if: ${{ env.SONAR_HOST_URL == '' || env.SONAR_PROJECT_KEY == '' }}
        run: |
          echo "::warning::DPR quality widgets require an onboarded SonarQube/SonarCloud tool plus SONAR_HOST_URL and SONAR_PROJECT_KEY repository variables. Test and JaCoCo reports are still available as workflow artifacts."

      - name: Add quality summary
        run: cat target/quality-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprintrunner-quality-results-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/unit-test-reports/
            target/functional-test-reports/
            target/performance-test-reports/
            target/site/jacoco/
            target/quality-reports/
