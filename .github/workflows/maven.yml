name: Maven release readiness

run-name: Release readiness for ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to validate (e.g. S24.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness-check:
    name: Release readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}
      SN_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}
      SN_CLIENT_ID: ${{ secrets.SN_CLIENT_ID }}
      SN_CLIENT_SECRET: ${{ secrets.SN_CLIENT_SECRET }}
    steps:
      - name: Check release readiness in ServiceNow
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          for required_secret in SN_INSTANCE_URL SN_CLIENT_ID SN_CLIENT_SECRET; do
            if [[ -z "${!required_secret:-}" ]]; then
              fail "Required GitHub secret $required_secret is not configured"
            fi
          done

          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            fail "Release version is missing or contains unsupported characters"
          fi

          instance_url="${SN_INSTANCE_URL%/}"
          if [[ ! "$instance_url" =~ ^https://[^/?#]+$ ]]; then
            fail "INSTANCE_URL must be an HTTPS origin such as https://example.service-now.com"
          fi

          token_body="$(mktemp "${RUNNER_TEMP}/servicenow-token.XXXXXX")"
          readiness_body="$(mktemp "${RUNNER_TEMP}/servicenow-readiness.XXXXXX")"
          trap 'rm -f -- "$token_body" "$readiness_body"' EXIT

          if ! token_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$token_body" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/json" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$SN_CLIENT_ID" \
            --data-urlencode "client_secret=$SN_CLIENT_SECRET" \
            "$instance_url/oauth_token.do")"; then
            fail "Could not reach the ServiceNow OAuth endpoint"
          fi

          if [[ "$token_status" != "200" ]]; then
            token_error="$(jq -r '.error_description // .error.message // .error // "no details"' "$token_body" 2>/dev/null || echo 'non-JSON response')"
            token_error="${token_error//$'\r'/ }"
            token_error="${token_error//$'\n'/ }"
            echo "ServiceNow OAuth response: $token_error"
            fail "ServiceNow OAuth token request failed with HTTP $token_status"
          fi

          if ! token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$token_body")"; then
            fail "ServiceNow returned HTTP 200 without a valid access token"
          fi
          echo "::add-mask::$token"

          if ! readiness_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$readiness_body" \
            --write-out '%{http_code}' \
            --get \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/json" \
            --data-urlencode "version=$VERSION" \
            "$instance_url/api/snc/release_readiness_api/release/readiness")"; then
            fail "Could not reach the ServiceNow readiness API"
          fi

          if [[ "$readiness_status" != "200" ]]; then
            details="$(jq -r '
              ((.result.blockers // []) + [(.error.message // empty), (.error.detail // empty)])
              | map(select(type == "string" and length > 0))
              | join("; ")
            ' "$readiness_body" 2>/dev/null || echo 'non-JSON response')"
            details="${details//$'\r'/ }"
            details="${details//$'\n'/ }"
            echo "ServiceNow readiness response: $details"
            fail "Readiness check for $VERSION failed with HTTP $readiness_status"
          fi

          if ! ready="$(jq -er '
            .result.ready as $ready
            | if ($ready | type) == "boolean" then ($ready | tostring)
              else error("result.ready must be a boolean")
              end
          ' "$readiness_body")"; then
            fail "ServiceNow returned an invalid readiness response"
          fi

          state="$(jq -r '.result.state // "unknown"' "$readiness_body")"
          state="${state//$'\r'/ }"
          state="${state//$'\n'/ }"

          {
            echo "## Release readiness gate"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- State: \`$state\`"
            echo "- Ready: \`$ready\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$ready" != "true" ]]; then
            echo "::error::Release $VERSION is not ready"
            while IFS= read -r blocker; do
              blocker="${blocker//$'\r'/ }"
              blocker="${blocker//$'\n'/ }"
              echo "Blocker: $blocker"
              echo "- $blocker" >> "$GITHUB_STEP_SUMMARY"
            done < <(jq -r '.result.blockers[]? | select(type == "string" and length > 0)' "$readiness_body")
            exit 1
          fi

          echo "Release $VERSION is ready. Build and test jobs may continue."

  # GitHub will not start this job unless the readiness gate succeeds, so no
  # checkout, build, or test command can run for a release that is not ready.
  quality:
    name: Build and quality tests
    needs: readiness-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
      SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY || vars.SONAR_ORG_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Test and coverage steps continue on error so every suite runs and its
      # results are published to ServiceNow. The final gate step fails the job.
      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        run: mvn -B clean test

      - name: Functional tests
        id: functional-tests
        continue-on-error: true
        run: mvn -B verify -Pfunctional-tests -DskipUnitTests

      - name: Performance tests
        id: performance-tests
        continue-on-error: true
        run: mvn -B verify -Pperformance-tests -DskipUnitTests

      - name: Code coverage
        id: coverage-check
        continue-on-error: true
        run: mvn -B jacoco:report@coverage-report jacoco:check@coverage-check

      - name: Generate reports from Maven test output
        if: always()
        env:
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_STAGE_NAME: Build and quality tests
        run: python3 scripts/generate-quality-reports.py

      - name: Publish unit test results to ServiceNow
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          xml-report-filename: target/quality-reports/servicenow-unit-tests.xml
          test-summary-name: SprintRunner unit tests

      - name: Publish functional test results to ServiceNow
        if: always()
        env:
          SN_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: sn_devops.DevOpsToken ${SN_ORCHESTRATION_TOOL_ID}:${SN_DEVOPS_INTEGRATION_TOKEN}" \
            --data-binary @target/quality-reports/servicenow-functional-tests.json \
            "${SN_INSTANCE_URL%/}/api/sn_devops/v2/devops/tool/test?toolId=${SN_ORCHESTRATION_TOOL_ID}&orchestrationToolId=${SN_ORCHESTRATION_TOOL_ID}&testType=Smoke"

      - name: Publish performance test results to ServiceNow
        if: always()
        env:
          SN_INSTANCE_URL: ${{ secrets.INSTANCE_URL }}
          SN_ORCHESTRATION_TOOL_ID: ${{ secrets.TOOL_ID }}
          SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: sn_devops.DevOpsToken ${SN_ORCHESTRATION_TOOL_ID}:${SN_DEVOPS_INTEGRATION_TOKEN}" \
            --data-binary @target/quality-reports/servicenow-performance-tests.json \
            "${SN_INSTANCE_URL%/}/api/sn_devops/v2/devops/tool/test?toolId=${SN_ORCHESTRATION_TOOL_ID}&orchestrationToolId=${SN_ORCHESTRATION_TOOL_ID}&testType=Load"

      # DPR quality widgets only read Software Quality Scan Summary/Detail records.
      # This official action creates those records and relates them to this job.
      # SONAR_HOST_URL and SONAR_PROJECT_KEY are repository variables; the Sonar
      # tool with that URL must also be onboarded in ServiceNow DevOps.
      - name: Publish software quality results to ServiceNow
        if: ${{ always() && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: ServiceNow/servicenow-devops-sonar@v7.1.0
        with:
          devops-integration-token: ${{ secrets.DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.INSTANCE_URL }}
          tool-id: ${{ secrets.TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: Build and quality tests
          sonar-host-url: ${{ env.SONAR_HOST_URL }}
          sonar-project-key: ${{ env.SONAR_PROJECT_KEY }}
          sonar-org-key: ${{ env.SONAR_ORG_KEY }}

      - name: Explain unavailable software quality publishing
        if: ${{ always() && (env.SONAR_HOST_URL == '' || env.SONAR_PROJECT_KEY == '') }}
        run: |
          echo "::warning::DPR quality widgets require an onboarded SonarQube/SonarCloud tool plus SONAR_HOST_URL and SONAR_PROJECT_KEY repository variables. Test and JaCoCo reports are still available as workflow artifacts."

      - name: Add quality summary
        if: always()
        run: cat target/quality-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprintrunner-quality-results-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/unit-test-reports/
            target/functional-test-reports/
            target/performance-test-reports/
            target/site/jacoco/
            target/quality-reports/

      - name: Fail job if any test or coverage step failed
        if: always()
        env:
          UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          FUNCTIONAL_TESTS: ${{ steps.functional-tests.outcome }}
          PERFORMANCE_TESTS: ${{ steps.performance-tests.outcome }}
          CODE_COVERAGE: ${{ steps.coverage-check.outcome }}
        run: |
          failed=""
          for step in UNIT_TESTS FUNCTIONAL_TESTS PERFORMANCE_TESTS CODE_COVERAGE; do
            outcome="${!step}"
            if [ "$outcome" != "success" ]; then
              failed="$failed $step ($outcome)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed. Results were published to ServiceNow before failing."
            exit 1
          fi
